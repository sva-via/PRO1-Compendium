site_name: "PRO1 Compendium"
site_url: https://sva-via.github.io/PRO1-Compendium/
site_description: "Compendium for PRO1"
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer 
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
plugins:
  - search

nav:
  - Home: index.md
  - Chapters:
      - "Chapter 1: What Is an Object?": chapter/01.md
      - "Chapter 2: Strings, References, and null": chapter/02.md
      - "Chapter 3: Classes": chapter/03.md
      - "Chapter 4: Selections": chapter/04.md
      - "Chapter 5: Invariants": chapter/05.md
      - "Chapter 6: Responsibility": chapter/06.md
      - "Chapter 7: Arrays": chapter/07.md
      - "Chapter 8: Loops": chapter/08.md
      - "Chapter 9: ArrayList": chapter/09.md
      - "Chapter 10: Associations": chapter/10.md
      - "Chapter 11: Mini-projekt": chapter/11.md
      - "Chapter 12: Design- og implementationsopgave": chapter/12.md
      - "Chapter 13: Refactoring og code smells (intro)": chapter/13.md
      - "Chapter 14: MyDate – en robust dato": chapter/14.md
      - "Chapter 15: Clock – repræsentationsvalg": chapter/15.md
      - "Chapter 16: Klassediagrammer": chapter/16.md
      - "Chapter 17: Fra tekst til model": v/17.md
  - Appendices:
      - "Appendix A: Java-syntaks quick reference": apendix/A.md
      - "Appendix B: IntelliJ quick guide": apendix/B.md
      - "Appendix C: Scanner og console I/O": apendix/C.md
      - "Appendix D: JUnit mini-guide": apendix/D.md
      - "Appendix E: Spec2JUnit: AI som sparringspartner til test": apendix/D.md
      
