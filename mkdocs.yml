site_name: "PRO1 Compendium"
site_url: https://sva-via.github.io/PRO1-Compendium/
site_description: "Compendium for PRO1"
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer 
    - content.code.copy
markdown_extensions:
