site_name: "PRO1 Compendium"
site_url: https://sva-via.github.io/PRO1-Compendium/
site_description: "Kompendium – kapitler 1-18 + bilag"
theme:
  name: material
  language: da
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer 
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
plugins:
  - search

nav:
  - Forside: index.md
  - Kapitler:
      - "Kapitel 1: Hvad er et objekt?": kapitel/01.md
      - "Kapitel 2: Første klasse: Name": kapitel/02.md
      - "Kapitel 3: Validering og exception": kapitel/03.md
      - "Kapitel 4: Metoder og ansvar": kapitel/04.md
      - "Kapitel 5: Ændring af tilstand (mutatorer)": kapitel/05.md
      - "Kapitel 6: Systematisk testdesign": kapitel/06.md
      - "Kapitel 7: Fra specifikation til tests": kapitel/07.md
      - "Kapitel 8: Relationer mellem objekter": kapitel/08.md
      - "Kapitel 9: Samlinger af objekter (1–til-mange relationer)": kapitel/09.md
      - "Kapitel 10: equals, identitet og lighed": kapitel/10.md
      - "Kapitel 11: Mini-projekt": kapitel/11.md
      - "Kapitel 12: Design- og implementationsopgave": kapitel/12.md
      - "Kapitel 13: Refactoring og code smells (intro)": kapitel/13.md
      - "Kapitel 14: MyDate – en robust dato": kapitel/14.md
      - "Kapitel 15: Clock – repræsentationsvalg": kapitel/15.md
      - "Kapitel 16: Klassediagrammer": kapitel/16.md
      - "Kapitel 17: Fra tekst til model": kapitel/17.md
  - Bilag:
      - "Bilag A: Java-syntaks quick reference": bilag/A.md
      - "Bilag B: IntelliJ quick guide": bilag/B.md
      - "Bilag C: Scanner og console I/O": bilag/C.md
      - "Bilag D: JUnit mini-guide": bilag/D.md
      - "Bilag E: Spec2JUnit: AI som sparringspartner til test": bilag/D.md
      
