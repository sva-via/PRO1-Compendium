      - "Chapter 11: Mini-projekt": kapitel/11.md
      - "Chapter 12: Design- og implementationsopgave": kapitel/12.md
      - "Chapter 13: Refactoring og code smells (intro)": kapitel/13.md
      - "Chapter 14: MyDate – en robust dato": kapitel/14.md
      - "Chapter 15: Clock – repræsentationsvalg": kapitel/15.md
      - "Chapter 16: Klassediagrammer": kapitel/16.md
