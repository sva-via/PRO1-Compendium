site_name: "PRO1 Compendium"
site_url: https://sva-via.github.io/PRO1-Compendium/
site_description: "Compendium for PRO1"
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer 
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      toc_depth: 2
      permalink: true
plugins:
  - search

nav:
  - Home: index.md
  - Chapters:
      - "Chapter 1: What Is an Object?": chapter/01.md
      - "Chapter 2: Strings, References, and null": chapter/02.md
      - "Chapter 3: Classes": chapter/03.md
      - "Chapter 4: Selections": chapter/04.md
      - "Chapter 5: Invariants": chapter/05.md
      - "Chapter 6: Responsibility": chapter/06.md
      - "Chapter 7: Arrays": chapter/07.md
      - "Chapter 8: Loops": chapter/08.md
      - "Chapter 9: ArrayList": chapter/09.md
      - "Chapter 10: Associations": chapter/10.md
      - "Chapter 11: Associations One-to-many": chapter/11.md
      - "Chapter 12: Inheritance": chapter/12.md
      - "Chapter 13: Inheritance design": chapter/13.md
      - "Chapter 14: Interfaces": chapter/14.md
      - "Chapter 15: File Persistence": chapter/15.md
      - "Chapter 16: GUI (Step 1, Layout)": chapter/16.md
      - "Chapter 17: GUI (Step 2, Data and Events):": chapter/17.md
      - "Chapter 18: GUI (Step 3, View state)": chapter/18.md
  - Appendices:
      - "Appendix A: Java Syntax Quick Reference": appendix/A.md
      - "Appendix B: IntelliJ IDEA Quick Guide": appendix/B.md
      - "Appendix C: Scanner and Console I/O": appendix/C.md
      - "Appendix D: JUnit Mini Guide": appendix/D.md

      
